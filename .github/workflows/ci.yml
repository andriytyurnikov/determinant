name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# setup-zig installs the version in build.zig.zon's minimum_zig_version, so CI and
# the declared requirement cannot drift apart.
#
# Every test-all run checks tests/digests.txt (zig build test-digests), so all
# jobs below must reach bit-identical final VM states.

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.optimize }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        optimize: [debug, fast]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: test-${{ matrix.optimize }}
      - run: zig build test-all -Doptimize=${{ matrix.optimize }} --summary all
      - name: CLI smoke run
        shell: bash
        run: |
          # The report goes to stderr; the program's output alone to stdout.
          zig build run -Doptimize=${{ matrix.optimize }} -- src/compliance/bin/rv32ui/simple.bin 2>&1 | tee out.txt
          grep -q "x3   gp   0x00000001  1$" out.txt

  big-endian:
    name: test (s390x big-endian, qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: big-endian
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: zig build test-all -Dtarget=s390x-linux-musl -fqemu --summary all

  memory-size:
    name: test (memory_size=${{ matrix.memory_size }})
    strategy:
      fail-fast: false
      matrix:
        memory_size: [64, 1048576, 268435456]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: memory-size-${{ matrix.memory_size }}
      - run: zig build test-all -Dmemory_size=${{ matrix.memory_size }} --summary all
      - name: CLI smoke run (debug and fast)
        shell: bash
        run: |
          # ADDI x1, x0, 42; EBREAK — small enough for every memory size
          printf '\223\000\240\002\163\000\020\000' > tiny.bin
          for opt in debug fast; do
            zig build run -Doptimize=$opt -Dmemory_size=${{ matrix.memory_size }} -- tiny.bin 2>&1 | tee out.txt
            grep -q "x1   ra   0x0000002A  42$" out.txt
          done

  decoder:
    name: decoder vs registry (all 2^30 32-bit encodings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: decoder
      - run: zig build verify-decoder

  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - run: zig fmt --check src build.zig tools

  compliance-rebuild:
    name: compliance suite rebuilt from source (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: compliance-rebuild
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      # Every rebuilt binary must pass. Byte identity with src/compliance/bin is not
      # required: other GCC/binutils versions encode a few tests differently.
      - run: make -C tests/riscv-tests BIN_DIR="$RUNNER_TEMP/rebuilt" BUILD_DIR="$RUNNER_TEMP/build"
      - run: zig build test-compliance-rebuild -Drebuilt_compliance="$RUNNER_TEMP/rebuilt"

  corpus-reproducible:
    name: C corpus rebuilds byte-identically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: corpus-reproducible
      - run: zig build programs
      - run: git diff --exit-code -- tests/programs
